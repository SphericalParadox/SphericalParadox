<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicoloured Rentals | Home</title>
    <style>
        @font-face { font-family: 'Gilmer'; src: url('Gilmer Regular.otf'); font-weight: normal; }
        @font-face { font-family: 'Gilmer'; src: url('Gilmer Bold.otf'); font-weight: bold; }

        :root { --main-blue: #0f283c; --white: #ffffff; }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Gilmer', sans-serif; background-color: var(--main-blue); color: var(--white); overflow: hidden; }

        /* Background Animation */
        .hero-full {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(15, 40, 60, 0.8), rgba(15, 40, 60, 0.8)), 
                        url('https://es5zyafq95u.exactdn.com/site-content/uploads/2025/11/Alexander-Dennis-Enviro100EV-toast-and-Enviro400EV-tea-1920x1200-c-default.webp');
            background-size: cover;
            background-position: center;
            animation: fadeInBg 1.5s ease-out;
        }

        @keyframes fadeInBg {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Content Animation */
        .content-box {
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-full img { width: 280px; margin-bottom: 20px; }
        .hero-full h1 { font-size: 4rem; margin: 10px 0; font-weight: bold; }
        
        .cta-container { margin-top: 30px; }

        .btn-main {
            padding: 16px 45px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.4s ease;
            margin: 0 10px;
            display: inline-block;
        }

        .btn-outline { border: 2px solid var(--white); color: var(--white); }
        .btn-white { background: var(--white); color: var(--main-blue); }

        .btn-main:hover { transform: translateY(-8px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="hero-full">
        <div class="content-box">
            <img src="https://files.multicolouredgroup.com/Static/MRwhite.png" alt="Logo">
            <h1>Move in Style.</h1>
            <p style="font-size: 1.2rem; opacity: 0.9;">Professional Bus & Coach rental for the modern world.</p>
            
            <div class="cta-container">
                <a href="vehicles.html" class="btn-main btn-white">Our Stock</a>
                <a href="https://www.mybustimes.cc" class="btn-main btn-outline">Contact Us</a>
            </div>
        </div>
    </div>

</body>
</html>
