<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Vehicles | Multicoloured Rentals</title>
    <style>
        @font-face { font-family: 'Gilmer'; src: url('Gilmer Regular.otf'); }
        @font-face { font-family: 'Gilmer'; src: url('Gilmer Bold.otf'); font-weight: bold; }

        :root { --main-blue: #0f283c; --card-bg: #16334d; --white: #ffffff; }

        body { background: var(--main-blue); color: var(--white); font-family: 'Gilmer', sans-serif; margin: 0; overflow-x: hidden; }
        
        nav { padding: 30px 10%; display: flex; justify-content: space-between; align-items: center; }
        .logo img { height: 45px; transition: transform 0.3s; }
        .logo img:hover { transform: scale(1.05); }
        .nav-links a { color: var(--white); text-decoration: none; margin-left: 30px; font-weight: bold; opacity: 0.8; transition: 0.3s; }
        .nav-links a:hover { opacity: 1; }

        .container { padding: 40px 10% 100px 10%; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 40px; 
        }

        /* CARD ANIMATION */
        @keyframes revealCard {
            0% { opacity: 0; transform: translateY(50px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .vehicle-card {
            background: var(--card-bg);
            border-radius: 40px; /* Extra rounded as requested */
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0; /* Hidden initially for animation */
            animation: revealCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Add delay to each item manually or via nth-child */
        .vehicle-card:nth-child(1) { animation-delay: 0.1s; }
        .vehicle-card:nth-child(2) { animation-delay: 0.3s; }
        .vehicle-card:nth-child(3) { animation-delay: 0.5s; }

        .img-placeholder {
            height: 250px;
            background: #1d3f5c;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.2);
        }

        .content { padding: 35px; }
        .content h3 { margin-top: 0; font-size: 2rem; margin-bottom: 10px;}
        .content p { opacity: 0.7; margin-bottom: 25px;}

        .btn-details { 
            background: var(--white); 
            color: var(--main-blue); 
            padding: 14px 30px; 
            border-radius: 50px; 
            text-decoration: none; 
            display: inline-block;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .img-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* or 'contain' depending on what you want */
        }

        .btn-details:hover { transform: translateX(10px); box-shadow: -5px 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><img src="https://files.multicolouredgroup.com/Static/MRwhite.png"></div>
        <div class="nav-links">
            <a href="rentals.html">Home</a>
            <a href="vehicles.html">Vehicles</a>
            <a href="https://www.mybustimes.cc">Contact</a>
        </div>
    </nav>

    <div class="container">
        <h1 style="font-size: 3.5rem; margin-bottom: 60px;">Our Stock</h1>
        
        <div class="grid">
            <div class="vehicle-card">
                <div class="img-placeholder">
                    <img src="https://www.alexander-dennis.com/site-content/uploads/2024/08/Alexander-Dennis-Enviro200-demonstrator-2-1000x750.jpg" alt="Vehicle" onerror="this.style.display='none';">
                </div>
                <div class="content">
                    <h3>Enviro 200</h3>
                    <a href="https://www.mybustimes.cc" class="btn-details">Enquire</a>
                </div>
            </div>

            <div class="vehicle-card">
                <div class="img-placeholder">
                    <img src="https://www.alexander-dennis.com/site-content/uploads/2024/07/Alexander-Dennis-Enviro400-demonstrator-1-1000x750.jpg" alt="Vehicle" onerror="this.style.display='none';">
                </div>
                <div class="content">
                    <h3>Enviro 400</h3>
                    <a href="https://www.mybustimes.cc" class="btn-details">Enquire</a>
                </div>
            </div>

            <div class="vehicle-card">
                <div class="img-placeholder">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Southport_Park_and_Ride_Enviro200_Dart_1.jpg" alt="Vehicle" onerror="this.style.display='none';">
                </div>
                <div class="content">
                    <h3>Enviro 200 (Dart/Classic)</h3>
                    <a href="https://www.mybustimes.cc" class="btn-details">Enquire</a>
                </div>
            </div>

            <div class="vehicle-card">
                <div class="img-placeholder">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/48/London_United_Alexander_Dennis_Enviro400_YX62_BBZ.jpg" alt="Vehicle" onerror="this.style.display='none';">
                </div>
                <div class="content">
                    <h3>Enviro 400 Classic</h3>
                    <a href="https://www.mybustimes.cc" class="btn-details">Enquire</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
